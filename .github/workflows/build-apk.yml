name: Debug Repository Files

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: List all files in repository
      run: |
        echo "=== Repozitórium tartalma ==="
        find . -maxdepth 3 -not -path '*/.*'
        
